name: attendence_app1
description: "University Attendance App built with Flutter and Firebase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # iOS Style Icons
  cupertino_icons: ^1.0.8

  # ==========================================================
  # Firebase
  # ==========================================================
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0

  # ==========================================================
  # State Management
  # ==========================================================
  provider: ^6.1.5

  # ==========================================================
  # QR Code
  # ==========================================================
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1

  # ==========================================================
  # Biometric Authentication
  # ==========================================================
  local_auth: ^2.3.0

  # ==========================================================
  # Utilities
  # ==========================================================
  intl: ^0.20.2
  uuid: ^4.5.1
  fluttertoast: ^8.2.12

  # ==========================================================
  # PDF & CSV Export
  # ==========================================================
  pdf: ^3.11.1
  printing: ^5.13.4
  csv: ^6.0.0

  # ==========================================================
  # File Storage & Sharing
  # ==========================================================
  path_provider: ^2.1.5
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # ==========================================================
  # Assets
  # ==========================================================
  assets:
    - assets/images/
    - assets/icons/

  # ==========================================================
  # Fonts (Optional)
  # Uncomment when adding custom fonts.
  # ==========================================================
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700